[project]
name = "mcp-context-inspector"
version = "0.1.0"
description = "MCP server + execution metrics recorder for agent sessions — real-time cost/token metrics and a full Context Window Explorer breakdown, over a real MCP handshake."
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "mcp",
    "boto3",
    "starlette",
    "uvicorn",
    "google-auth[requests]",
    "google-cloud-firestore",
]

[project.optional-dependencies]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mcp_server", "metrics", "mci_common"]
