[project]
name = "mcp-context-inspector"
version = "0.2.0"
description = "MCP server + execution metrics recorder for agent sessions: real-time cost/token metrics and a full Context Window Explorer breakdown, over a real MCP handshake."
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "mcp",
    "boto3",
    "starlette",
    "uvicorn",
    "google-auth[requests]",
    "google-cloud-firestore",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
# Default set (pyflakes + a slice of pycodestyle). This is a lint pass
# to catch real mistakes (unused imports, undefined names, bare excepts),
# not a full style-enforcement rewrite of an existing codebase.
select = ["E", "F", "W"]
ignore = ["E501"]  # line length handled by the formatter, not the linter

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mcp_server", "metrics", "mci_common"]
