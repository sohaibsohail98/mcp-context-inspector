name: Deploy

on:
  push:
    branches: [main]
    paths:
      - "mcp_server/**"
      - "metrics/**"
      - "mci_common/**"
      - "scripts/**"
      - "demo/**"
      - "webapp/**"
      - "dashboard/**"
      - "docs-site/**"
      - "static/**"
      - "Dockerfile"
      - "pyproject.toml"
      - "uv.lock"
      - "cloudflare-proxy/**"
      - "infrastructure/terraform/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  REGION: us-central1
  SERVICE: mcp-context-inspector
  IMAGE: us-central1-docker.pkg.dev/${{ vars.GCP_PROJECT }}/sre-platform/mcp-context-inspector

jobs:
  deploy-cloud-run:
    runs-on: ubuntu-latest
    outputs:
      service_url: ${{ steps.tf-outputs.outputs.service_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.0.1
      - run: uv venv && uv pip install -e ".[dev]"
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: google-github-actions/setup-gcloud@v3
      - run: gcloud components install cloud-firestore-emulator --quiet
      - name: Start Firestore emulator
        run: |
          nohup gcloud emulators firestore start --host-port=localhost:8901 >/tmp/firestore-emulator.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -s localhost:8901 >/dev/null 2>&1; then echo "emulator up"; break; fi
            sleep 1
          done
      - run: uv run python -m pytest -v
        env:
          FIRESTORE_EMULATOR_HOST: localhost:8901
          GOOGLE_CLOUD_PROJECT: demo-ci

      - id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}

      - uses: google-github-actions/setup-gcloud@v3

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker us-central1-docker.pkg.dev --quiet

      - name: Build and push image
        run: |
          docker buildx build --platform linux/amd64 \
            -t "${IMAGE}:${{ github.sha }}" \
            -t "${IMAGE}:latest" \
            --push .

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.13"
          terraform_wrapper: false

      - name: Record the currently-live image tag
        id: previous
        run: |
          echo "tag=$(gcloud run services describe "$SERVICE" \
            --project="${{ vars.GCP_PROJECT }}" --region="$REGION" \
            --format='value(spec.template.spec.containers[0].image)' | cut -d: -f2)" >> "$GITHUB_OUTPUT"

      - name: Terraform plan and apply
        working-directory: infrastructure/terraform
        run: |
          terraform init -input=false -lock-timeout=2m
          terraform plan -input=false -lock-timeout=2m -out=tfplan \
            -var="image_tag=${{ github.sha }}"
          terraform apply -input=false -lock-timeout=2m -auto-approve tfplan
          echo "service_url=$(terraform output -raw cloud_run_url)" >> "$GITHUB_OUTPUT"
        id: tf-outputs

      - name: Smoke-test the deployment
        id: smoke-test
        run: |
          curl -sf "${{ steps.tf-outputs.outputs.service_url }}/health" | grep -q '"status":"ok"'

      - name: Roll back on smoke-test failure
        if: failure()
        working-directory: infrastructure/terraform
        run: |
          terraform apply -input=false -lock-timeout=2m -auto-approve \
            -var="image_tag=${{ steps.previous.outputs.tag }}"

  deploy-cloudflare-worker:
    needs: deploy-cloud-run
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloudflare-proxy
    steps:
      - uses: actions/checkout@v7
      - run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      - name: Smoke-test the Worker proxy
        run: |
          sleep 5
          curl -sf "https://ctxwindow.uk/health" | grep -q '"status":"ok"'
